#set -g default-terminal "tmux-256color"
set -g default-terminal "tmux-256color"
#set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"
# action key
unbind C-b
set-option -g prefix C-f
set-option -g repeat-time 0
set-option -g focus-events on

#### Key bindings
unbind '"'
bind - splitw -v -c '#{pane_current_path}' # 垂直方向新增面板，默认进入当前目录
unbind %
bind =  splitw -h -c '#{pane_current_path}' # 水平方向新增面板，默认进入当前目录

set-option -g mouse on

set-window-option -g mode-keys vi

#bind t send-key C-t
# Reload settings
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
# Open current directory (platform-adaptive: macOS open / Windows explorer.exe / Linux xdg-open;
# uname 输出 MINGW/MSYS/CYGWIN 时视为 Windows，含 psmux 场景)
if-shell 'uname -s | grep -q Darwin' 'bind o run-shell "open #{pane_current_path}"'
if-shell 'uname -s | grep -qiE "MINGW|MSYS|CYGWIN"' 'bind o run-shell "explorer.exe #{pane_current_path}"'
if-shell 'uname -s | grep -q Linux' 'bind o run-shell "xdg-open #{pane_current_path}"'
bind e kill-pane -a

# vim-like pane switching（不加 -r：repeat-time 已设 0，-r 在真实 tmux 无效，psmux 也不支持）
bind k select-pane -U
bind j select-pane -D
bind h select-pane -L
bind l select-pane -R

# Moving window
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# Resizing pane
bind C-k resize-pane -U 5
bind C-j resize-pane -D 5
bind C-h resize-pane -L 5
bind C-l resize-pane -R 5

#### basic settings

set-option -g status-justify "left"
#set-option utf8-default on
#set-option -g mouse-select-pane
set-window-option -g mode-keys vi
#set-window-option -g utf8 on
# look'n feel（status 颜色统一在 statusline.conf 的 status-style 设置，
# 不用 status-fg/status-bg 老式选项：psmux 未实现，且会被 status-style 覆盖）
set -g pane-active-border-style fg=colour166,bg=default
set -g window-style fg=colour10,bg=default
set -g window-active-style fg=colour12,bg=default
set-option -g history-limit 64096

set -sg escape-time 10

#### COLOUR

# default statusbar colors
set-option -g status-style bg=colour235,fg=colour136,default

# default window title colors
set-window-option -g window-status-style fg=colour244,bg=colour234,dim

# active window title colors
set-window-option -g window-status-current-style fg=colour166,bg=default,bright

# pane border
set-option -g pane-border-style fg=colour235 #base02
set-option -g pane-active-border-style fg=colour136,bg=colour235

# message text
set-option -g message-style bg=colour235,fg=colour166

# pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour166 #orange

# clock
set-window-option -g clock-mode-colour colour64 #green

# allow the title bar to adapt to whatever host you connect to
set -g set-titles on
set -g set-titles-string "#T"

# import
if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"

source ~/.config/tmux/statusline.conf
source ~/.config/tmux/utility.conf

